services:
  sanitizer:
    image: qaxim/sanitizer:1.0.0
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - LOG_LEVEL=info
  nginx:
    image: nginx:alpine
    ports:
      - "8443:443"
      - "28080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - sanitizer
